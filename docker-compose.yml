version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: 17a_postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: proposals_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: 17a_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: 17a_backend
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: "postgresql://root:password@postgres:5432/proposals_db?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "supersecret17a"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: 17a_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
